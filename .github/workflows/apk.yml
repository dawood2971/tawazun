name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app:
        description: tawazun or bawsala
        default: tawazun

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Request package from PWABuilder
        run: |
          # A throwaway signing key for each build; it is never stored.
          if [ "${{ inputs.app }}" = "bawsala" ]; then
            ID=io.github.dawood2971.bawsala; NAME="بوصلة"; PATH_=/school-health-planner/
            THEME="#0f766e"; BG="#f8fafc"; MASK=icons/icon-512.png
          else
            ID=io.github.dawood2971.tawazun; NAME="توازن"; PATH_=/tawazun-app/
            THEME="$THEME"; BG="$BG"; MASK=icons/icon-maskable-512.png
          fi
          BASE="https://dawood2971.github.io$PATH_"
          echo "APP=${{ inputs.app }}" >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          PW=$(openssl rand -hex 16)
          echo "::add-mask::$PW"
          cat > req.json <<JSON
          {
            "packageId": "$ID",
            "name": "$NAME",
            "launcherName": "$NAME",
            "appVersion": "1.0.${{ github.run_number }}",
            "appVersionCode": ${{ github.run_number }},
            "host": "https://dawood2971.github.io",
            "startUrl": "$PATH_",
            "fullScopeUrl": "$BASE",
            "webManifestUrl": "${BASE}manifest.webmanifest",
            "iconUrl": "${BASE}icons/icon-512.png",
            "maskableIconUrl": "${BASE}$MASK",
            "monochromeIconUrl": null,
            "themeColor": "$THEME",
            "themeColorDark": "$THEME",
            "backgroundColor": "$BG",
            "navigationColor": "$THEME",
            "navigationColorDark": "$THEME",
            "navigationDividerColor": "$THEME",
            "navigationDividerColorDark": "$THEME",
            "display": "standalone",
            "orientation": "portrait",
            "fallbackType": "customtabs",
            "enableNotifications": true,
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "minSdkVersion": 21,
            "splashScreenFadeOutDuration": 300,
            "shortcuts": [],
            "features": { "locationDelegation": { "enabled": true }, "playBilling": { "enabled": false } },
            "includeSourceCode": false,
            "signingMode": "new",
            "signing": {
              "file": null,
              "alias": "tawazun",
              "fullName": "Dawood",
              "organization": "Dawood",
              "organizationalUnit": "Personal",
              "countryCode": "OM",
              "keyPassword": "$PW",
              "storePassword": "$PW"
            }
          }
          JSON
          code=$(curl -sS -m 600 -o out.bin -w "%{http_code}" \
            -H "Content-Type: application/json" \
            --data @req.json \
            https://pwabuilder-cloudapk.azurewebsites.net/generateAppPackage)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then head -c 3000 out.bin; exit 1; fi
          mkdir pkg && cd pkg && unzip -o ../out.bin && ls -la

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls pkg/*.apk | head -1)
          cp "$apk" "$APP.apk"
          gh release create "$APP-v1.0.${{ github.run_number }}" "$APP.apk" \
            --repo "${{ github.repository }}" \
            --title "$NAME 1.0.${{ github.run_number }}" \
            --notes "نزّل $APP.apk وثبّته على الجوال."
