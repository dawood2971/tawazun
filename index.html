<style>
/* Layout: one phone-width column, a dusk-coloured hero per page, flat lists, fixed bottom tab bar */
:root{
  --bg:#EDF0EC; --surface:#FFFFFF; --sunk:#E2E7E2; --ink:#16201E; --muted:#596763; --line:#D2D9D3;
  --accent:#B4621A; --accent-soft:#F5E4D2; --on-accent:#FFFFFF;
  --deep:#1D4F53; --deep-soft:#D8E7E5;
  --hero-bg:#1D4F53; --hero-ink:#F1F5F2; --hero-muted:#B9CFCB; --hero-glow:rgba(232,150,70,.55);
  --good:#2D7A4C; --warn:#A86E12; --bad:#B03E2C;
  --f-display:"Alexandria","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1516; --surface:#162021; --sunk:#1F2B2C; --ink:#E6ECE9; --muted:#93A39E; --line:#2A3839;
  --accent:#E59A50; --accent-soft:#3A2814; --on-accent:#1B1104;
  --deep:#8CC3C3; --deep-soft:#1C3334;
  --hero-bg:#163436; --hero-ink:#E9F0ED; --hero-muted:#9DBAB6; --hero-glow:rgba(229,154,80,.35);
  --good:#6BC291; --warn:#E3B25A; --bad:#E57D6A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1516; --surface:#162021; --sunk:#1F2B2C; --ink:#E6ECE9; --muted:#93A39E; --line:#2A3839;
  --accent:#E59A50; --accent-soft:#3A2814; --on-accent:#1B1104;
  --deep:#8CC3C3; --deep-soft:#1C3334;
  --hero-bg:#163436; --hero-ink:#E9F0ED; --hero-muted:#9DBAB6; --hero-glow:rgba(229,154,80,.35);
  --good:#6BC291; --warn:#E3B25A; --bad:#E57D6A; color-scheme:dark }

/* Per-page identity: مَسَار dusk teal + amber, واحة oasis green, بيتي terracotta clay, محفظتي navy + gold */
:root[data-page="waha"]{ --bg:#EEF4EC; --surface:#FFFFFF; --sunk:#DFEADB; --ink:#142118; --muted:#56685A; --line:#CFDDCB;
  --accent:#2F8F5B; --accent-soft:#D6EEDD; --on-accent:#FFFFFF; --deep:#1F6F78; --deep-soft:#D3E9EC;
  --hero-bg:#2C7A55; --hero-ink:#F2FAF4; --hero-muted:#CBE5D4; --hero-glow:rgba(160,235,200,.45);
  --f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif }
@media (prefers-color-scheme: dark){ :root[data-page="waha"]:not([data-theme="light"]){ --bg:#0D1611; --surface:#142019; --sunk:#1C2B22; --ink:#E4EFE7; --muted:#8FA897; --line:#253629;
  --accent:#5FC88D; --accent-soft:#173323; --on-accent:#06150C; --deep:#7CC6CF; --deep-soft:#15302F;
  --hero-bg:#17402C; --hero-ink:#EAF6EE; --hero-muted:#A6CDB4; --hero-glow:rgba(95,200,141,.3); } }
:root[data-page="waha"][data-theme="dark"]{ --bg:#0D1611; --surface:#142019; --sunk:#1C2B22; --ink:#E4EFE7; --muted:#8FA897; --line:#253629;
  --accent:#5FC88D; --accent-soft:#173323; --on-accent:#06150C; --deep:#7CC6CF; --deep-soft:#15302F;
  --hero-bg:#17402C; --hero-ink:#EAF6EE; --hero-muted:#A6CDB4; --hero-glow:rgba(95,200,141,.3); }
:root[data-page="beiti"]{ --bg:#F7EBEF; --surface:#FFFFFF; --sunk:#F0DEE6; --ink:#33263D; --muted:#6F5E78; --line:#E8D3DD;
  --accent:#6B4F78; --accent-soft:#F1DDE6; --on-accent:#FFFFFF; --deep:#6B4F78; --deep-soft:#EADCF0;
  --hero-bg:#6B4F78; --hero-ink:#FFFFFF; --hero-muted:#EADCF0; --hero-glow:rgba(241,154,62,.45);
  --f-display:"El Messiri","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif; color-scheme:light }
:root[data-page="beiti"] .nav a[aria-current="page"]{box-shadow:inset 0 -3px 0 #F19A3E}
:root[data-page="beiti"] .seg button[aria-selected="true"]{box-shadow:inset 0 -3px 0 #F19A3E,0 1px 3px rgba(0,0,0,.12)}
:root[data-page="mahfazti"]{ --bg:#EDEFF5; --surface:#FFFFFF; --sunk:#E0E4EE; --ink:#141A2B; --muted:#586079; --line:#D2D7E4;
  --accent:#A57A12; --accent-soft:#F3E8C8; --on-accent:#FFFFFF; --deep:#2C3E7A; --deep-soft:#DCE2F3;
  --hero-bg:#1B2A55; --hero-ink:#F4F1E6; --hero-muted:#B9C0DA; --hero-glow:rgba(212,175,80,.35);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif }
@media (prefers-color-scheme: dark){ :root[data-page="mahfazti"]:not([data-theme="light"]){ --bg:#0C1020; --surface:#141A2E; --sunk:#1C2440; --ink:#E7EAF3; --muted:#96A0BE; --line:#27304D;
  --accent:#DDB45A; --accent-soft:#352B12; --on-accent:#1A1404; --deep:#9CB0EE; --deep-soft:#1D2647;
  --hero-bg:#1A2550; --hero-ink:#F4EEDC; --hero-muted:#A9B3D6; --hero-glow:rgba(221,180,90,.25); } }
:root[data-page="mahfazti"][data-theme="dark"]{ --bg:#0C1020; --surface:#141A2E; --sunk:#1C2440; --ink:#E7EAF3; --muted:#96A0BE; --line:#27304D;
  --accent:#DDB45A; --accent-soft:#352B12; --on-accent:#1A1404; --deep:#9CB0EE; --deep-soft:#1D2647;
  --hero-bg:#1A2550; --hero-ink:#F4EEDC; --hero-muted:#A9B3D6; --hero-glow:rgba(221,180,90,.25); }

/* واحة: soft, rounded, leaf-shaped hero with water bubbles */
:root[data-page="waha"]{--r:20px}
:root[data-page="waha"] .hero{border-radius:36px 36px 36px 8px}
:root[data-page="waha"] .hero::after{inset:0;height:auto;background:radial-gradient(circle at 34% 18%,var(--hero-glow) 0 18px,transparent 19px),radial-gradient(circle at 24% 62%,var(--hero-glow) 0 10px,transparent 11px),radial-gradient(circle at 6% 80%,var(--hero-glow) 0 14px,transparent 15px),radial-gradient(ellipse at 0% 100%,var(--hero-glow),transparent 60%)}
:root[data-page="waha"] .check{border-radius:50%}
:root[data-page="waha"] .ph h1{font-size:2.2rem}
/* بيتي: arched doorway hero with a tiled floor pattern */
:root[data-page="beiti"]{--r:10px}
:root[data-page="beiti"] .hero{border-radius:50% 50% 14px 14px / 64px 64px 14px 14px;padding-top:34px;text-align:center}
:root[data-page="beiti"] .hero::after{inset:auto 0 0 0;height:46%;background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 12px,transparent 12px 24px),repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 12px,transparent 12px 24px)}
:root[data-page="beiti"] .hero .row{justify-content:center}
:root[data-page="beiti"] .seg{border-radius:10px}
:root[data-page="beiti"] .seg button{border-radius:7px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;text-align:right}
.home-grid div{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;min-width:0}
.home-grid b{display:block;font-family:var(--f-display);font-size:1.25rem;line-height:1.2}
.home-grid span{font-size:.78rem;color:var(--hero-muted)}
/* محفظتي: bank-card hero with gold chip and sheen */
:root[data-page="mahfazti"]{--r:8px}
:root[data-page="mahfazti"] .hero{border-radius:16px;padding-bottom:58px}
:root[data-page="mahfazti"] .hero::after{inset:0;height:auto;background:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 2px,transparent 2px 14px),radial-gradient(ellipse at 100% 0%,var(--hero-glow),transparent 55%)}
:root[data-page="mahfazti"] .hero::before{display:none;content:"";position:absolute;left:18px;bottom:18px;width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#E9C874,#B48A2C);opacity:.85}
:root[data-page="mahfazti"] .hero .big{letter-spacing:.03em}
:root[data-page="mahfazti"] .btn,:root[data-page="mahfazti"] .add input,:root[data-page="mahfazti"] .add select{border-radius:8px}
:root[data-page="mahfazti"] .chip-b{border-radius:6px}

/* مَسَار: calm navy, soft green and light beige */
:root[data-page="masai"]{ --bg:#F4EFE6; --surface:#FFFDF9; --sunk:#E9E2D5; --ink:#1A2438; --muted:#5E6575; --line:#DDD5C6;
  --accent:#3D7F67; --accent-soft:#DCEBE3; --on-accent:#FFFFFF; --deep:#22365C; --deep-soft:#DDE3EE;
  --hero-bg:#1E2F50; --hero-ink:#F5F1E8; --hero-muted:#B8C2D6; --hero-glow:rgba(120,190,160,.35) }
:root{ --trunk:#7A5A3E; --leaf:#4F9A74; --leaf2:#6FB38D; --soil:#D9CFBD; --dead:#A8A29A;
  --m5:#3E9A6B; --m4:#8CC09A; --m3:#E2C26A; --m2:#E59A66; --m1:#D26F6C }
@media (prefers-color-scheme: dark){   :root:not([data-theme="light"]){ --trunk:#A07C5A; --leaf:#5DB386; --leaf2:#86CBA3; --soil:#2B3448; --dead:#6B6F78 } }
:root[data-theme="dark"]{ --trunk:#A07C5A; --leaf:#5DB386; --leaf2:#86CBA3; --soil:#2B3448; --dead:#6B6F78 }
:root[data-page="masai"] .btn{min-height:48px}
.btn.big{width:100%;height:56px;font-size:1.05rem;border-radius:14px}
.grow-btn{flex:1 1 auto;height:46px!important}
.qnav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);scrollbar-width:none}
.qnav::-webkit-scrollbar{display:none}
.qnav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.88rem;font-weight:500}
.sec{scroll-margin-top:calc(60px + env(safe-area-inset-top,0px))}
.task{display:flex;align-items:center;gap:8px;padding:10px 10px;border-top:1px solid var(--line);background:var(--surface);min-height:60px}
.task:first-child{border-top:0}
.task.top{background:color-mix(in srgb,var(--accent-soft) 60%,var(--surface))}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task.dragging{opacity:.85;box-shadow:0 6px 18px rgba(0,0,0,.18);position:relative;z-index:2}
.task .grow{flex:1;min-width:0}
.task-t{border:0;background:none;padding:0;text-align:right;font-weight:500;width:100%;overflow-wrap:anywhere;display:block}
.meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.meta .st{border:0;cursor:pointer}
.bell{display:inline-flex;align-items:center;gap:3px}.bell svg{width:12px;height:12px}
.drag{flex:none;width:28px;height:40px;border:0;background:none;color:var(--muted);touch-action:none;cursor:grab;padding:0;display:grid;place-items:center}
.drag svg{width:18px;height:18px}
.star,.play{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted)}
.star svg{width:20px;height:20px;fill:none}.star.on{color:var(--warn);border-color:var(--warn)}.star.on svg{fill:currentColor}
.play{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.play svg{width:18px;height:18px}
.top-card{background:var(--deep);color:var(--bg);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column}
.top-card .sub{color:inherit;opacity:.75}.top-card b{font-family:var(--f-display);font-size:1.1rem}
.top-card.done b{text-decoration:line-through;opacity:.7}
.note-card{margin-top:12px;border-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.cheer{text-align:center;color:var(--accent);font-weight:500;margin-top:8px;font-size:.92rem}
.msg{text-align:center;font-weight:600;margin-top:6px}
.tree{width:100%;max-width:220px;height:auto;display:block;margin:0 auto}
.tree.mini{max-width:none}
.focus-live,.focus-idle{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.focus-idle .tree{max-width:120px;opacity:.9}
.focus-live .disp{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1.1}
.fstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px;text-align:center}
.fstats b{display:block;font-family:var(--f-display);font-size:1.4rem}.fstats span{font-size:.78rem;color:var(--muted)}
.garden{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.garden p{grid-column:1/-1;text-align:center;padding:8px}
.big-chip{padding:9px 14px;font-size:.92rem}
.item.pray{min-height:58px}.item.pray.next{background:var(--accent-soft)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{border:2px solid transparent;background:var(--sunk);border-radius:14px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;font-weight:500}
.mood svg{width:38px;height:38px}.mood.on{border-color:var(--ink);background:var(--surface)}
.mood-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.mood-grid i{display:block;aspect-ratio:1;max-width:100%;border-radius:8px}.mood-grid small{font-size:.68rem;color:var(--muted)}
.end-day{margin-top:26px;background:var(--deep);color:var(--bg)}
.pick-row{width:100%;border:0;border-top:1px solid var(--line);background:var(--surface);text-align:right;color:inherit}
.pick-row:first-child{border-top:0}.pick-row .meta{display:flex}
.pick-row .play{width:34px;height:34px}
.chip-b.radio{cursor:pointer}.chip-b.radio input{position:absolute;opacity:0;pointer-events:none}
.chip-b.radio:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qibla{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.dial-wrap{width:min(260px,80vw);height:auto}
.big-num{font-family:var(--f-display);font-size:2.2rem;font-weight:700}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.summary div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.summary span{font-size:.8rem;color:var(--muted)}.summary b{font-family:var(--f-display);font-size:1.1rem;overflow-wrap:anywhere}
.search{width:100%}

/* مَسَار v2: one calm light look (beige ground, navy hero, soft green actions) with section cards */
:root[data-page="masai"]{color-scheme:light; --bg:#F3EDE2; --surface:#FFFDF8; --sunk:#ECE5D8; --ink:#1B2740; --muted:#6A7285; --line:#E4DCCD;
  --accent:#3F8A6E; --accent-soft:#DCEDE4; --on-accent:#FFFFFF; --deep:#1F3157; --deep-soft:#E1E6F0;
  --hero-bg:#1F3157; --hero-ink:#F7F2E8; --hero-muted:#B9C3D9; --hero-glow:rgba(127,196,165,.28);
  --good:#3F8A6E; --warn:#B7862B; --bad:#C0584F; --trunk:#7A5A3E; --leaf:#4F9A74; --leaf2:#7DBB97; --soil:#E0D6C4; --dead:#B1ABA2;
  --m5:#3F9A6E; --m4:#93C4A0; --m3:#E6C76F; --m2:#E9A06C; --m1:#D57470;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif; --f-body:"Readex Pro","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif; --r:16px }
:root[data-page="masai"] .mph h1{font-size:2.3rem;font-weight:700;color:var(--deep)}
:root[data-page="masai"] .mph .eyebrow{color:var(--accent);font-weight:500}
.mhero{border-radius:28px!important;padding:20px!important}
/* next-prayer card: night photo of the Kaaba and clock tower under a navy gradient so the text stays readable */
.mhero{min-height:330px;background:#16244A!important;display:flex;flex-direction:column;justify-content:space-between}

.mh-bg.day{background-image:linear-gradient(to bottom,rgba(12,20,44,.6) 0%,rgba(12,20,44,0) 36%,rgba(12,20,44,0) 58%,rgba(12,20,44,.7) 100%),linear-gradient(to left,rgba(16,28,58,.45) 0%,rgba(16,28,58,0) 60%),radial-gradient(circle at 26% 34%,rgba(255,226,170,.85) 0 26px,rgba(255,206,140,.35) 27px 46px,rgba(255,196,120,0) 120px),radial-gradient(ellipse at 50% 120%,rgba(232,160,96,.55),rgba(232,160,96,0) 60%),linear-gradient(to bottom,#1B3566 0%,#285C86 48%,#4F8A93 78%,#B9875E 100%)}

.mhero[data-mode="day"] .mh-time{color:#C5F0DB}
@media (prefers-reduced-motion:reduce){.mh-bg{transition:none}}
.mhero::after{display:none}
.mhero .big,.mhero .mh-date,.mhero .mh-time,.mhero .lbl{text-shadow:0 1px 8px rgba(5,10,25,.7)}
.mhero .mh-time{color:#A8E0C6}
.mhero .chip{background:rgba(12,20,44,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ring-wrap{border-radius:50%;background:rgba(12,20,44,.58);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.mh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mh-date{font-weight:600;font-size:.95rem}
.mh-clock{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1.1;letter-spacing:.5px;white-space:nowrap;text-shadow:0 1px 8px rgba(5,10,25,.7);margin-bottom:2px}.mh-clock small{font-size:.5em;font-weight:600;opacity:.85;vertical-align:middle}
.mh-main{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px}
.mh-name .big{font-size:2.6rem!important}
.mh-time{font-size:1.05rem;color:var(--hero-muted)}
.ring-wrap{position:relative;width:132px;height:132px;flex:none}
.ring{width:100%;height:100%}
.ring-bg{fill:none;stroke:rgba(255,255,255,.14);stroke-width:9}
.ring-fg{fill:none;stroke:#8FD3B4;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c span{font-size:.78rem;color:var(--hero-muted)}.ring-c b{font-size:1.25rem;font-weight:600;letter-spacing:.02em}
:root[data-page="masai"] .qnav{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:var(--deep);border-radius:20px;padding:6px;margin-top:12px;top:calc(6px + env(safe-area-inset-top,0px));box-shadow:0 6px 18px rgba(31,49,87,.22);overflow:visible}
:root[data-page="masai"] .qnav button{border:0;background:transparent;color:#DCE3F0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;font-size:.74rem;min-height:52px}
:root[data-page="masai"] .qnav button svg{width:20px;height:20px}
:root[data-page="masai"] .qnav button:active{background:rgba(255,255,255,.12)}
:root[data-page="masai"] .qnav button[aria-pressed="true"]{background:#F7F2E8;color:var(--deep);font-weight:600}
:root[data-page="masai"] .sec{background:var(--surface);border-radius:26px;padding:18px 16px;margin-top:16px;box-shadow:0 1px 2px rgba(31,49,87,.05),0 10px 28px rgba(31,49,87,.07);scroll-margin-top:calc(84px + env(safe-area-inset-top,0px))}
:root[data-page="masai"] .sec>.sec-h h2,:root[data-page="masai"] .sec .sec-h h2{font-size:1.25rem;color:var(--deep);display:flex;align-items:center;gap:8px}
:root[data-page="masai"] .sec .sec-h h2::before{content:"";width:8px;height:22px;border-radius:4px;background:var(--accent)}
:root[data-page="masai"] .sec .list{border:0;background:transparent;display:flex;flex-direction:column;gap:8px;overflow:visible}
:root[data-page="masai"] .sec .list>.task,:root[data-page="masai"] .sec .list>.item{border:0;border-radius:18px;background:var(--bg);min-height:64px}
:root[data-page="masai"] .sec .list>.task.top{background:var(--accent-soft)}
:root[data-page="masai"] .card{border:0;background:var(--bg);border-radius:20px}
:root[data-page="masai"] .inner{background:var(--bg);border-radius:20px;padding:14px}
:root[data-page="masai"] .note-card{background:#FBF1DC;border:0;border-radius:20px}
:root[data-page="masai"] .check{border-radius:50%;width:32px;height:32px;border-color:#C9C1B2}
:root[data-page="masai"] .btn{border-radius:999px;min-height:50px;padding:0 20px}
:root[data-page="masai"] .btn.big{height:60px;font-size:1.1rem;box-shadow:0 8px 20px rgba(63,138,110,.28)}
:root[data-page="masai"] .btn.big.ghost{box-shadow:none;background:var(--deep-soft);color:var(--deep)}
:root[data-page="masai"] .btn.line{border-radius:999px;border-color:var(--line);background:var(--bg)}
:root[data-page="masai"] .add input,:root[data-page="masai"] .field{border-radius:16px;background:var(--bg);border-color:transparent;height:52px}
:root[data-page="masai"] textarea.field{height:auto}
:root[data-page="masai"] .chip-b{border-radius:999px;background:var(--bg);border-color:transparent}
:root[data-page="masai"] .chip-b[aria-pressed="true"]{background:var(--deep);color:#fff}
:root[data-page="masai"] .star,:root[data-page="masai"] .play{border-radius:50%;width:38px;height:38px}
:root[data-page="masai"] .task{gap:5px;padding-inline:8px}
:root[data-page="masai"] .task .drag{width:20px}
:root[data-page="masai"] .star{background:var(--surface);border-color:transparent}
:root[data-page="masai"] .top-card{border-radius:20px;background:linear-gradient(135deg,var(--deep),#2C4777);color:#F7F2E8;padding:14px 16px}
:root[data-page="masai"] .end-day{height:62px;background:var(--deep);color:#F7F2E8;box-shadow:0 8px 20px rgba(31,49,87,.25)}
:root[data-page="masai"] .mood{background:var(--bg);border-radius:18px}
:root[data-page="masai"] .mood.on{border-color:var(--deep);background:var(--surface)}
:root[data-page="masai"] .garden{border:0;background:var(--bg);border-radius:20px}
:root[data-page="masai"] .banner{border-radius:18px}
.ptiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ptile{border:0;background:var(--bg);border-radius:18px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:96px;color:var(--ink)}
.ptile .pn{font-size:.82rem;font-weight:600}.ptile .pt{font-size:.95rem;font-weight:600}
.ptile .pc{width:24px;height:24px;border-radius:50%;border:2px solid #C9C1B2;margin-top:4px;display:grid;place-items:center}
.ptile.on .pc{background:var(--accent);border-color:var(--accent)}
.ptile.on .pc::after{content:"";width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.ptile.next{background:var(--deep);color:#F7F2E8}.ptile.next .pc{border-color:rgba(255,255,255,.5)}
@media (max-width:360px){.ring-wrap{width:112px;height:112px}.mh-name .big{font-size:2.1rem!important}}

.wnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}

/* priority matrix colours: red-orange do, green plan, blue delegate, grey drop, light neutral for unclassified */
:root{--q-do:#C2532F;--q-plan:#2F8460;--q-del:#2F68B0;--q-drop:#6F7580;--q-none:#BDB7AC}
.task,.inbox-item{border-inline-start:5px solid var(--qc,transparent)!important}
.qpill{border:0;cursor:pointer;background:color-mix(in srgb,var(--qc) 16%,transparent);color:color-mix(in srgb,var(--qc) 80%,#000);font-weight:600}

.qg-h b{color:color-mix(in srgb,var(--qc) 85%,#000)}.qg-act{font-size:.8rem;color:var(--muted);flex:1}
.qg-n{min-width:26px;height:26px;border-radius:50%;background:var(--qc);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:600}

.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbox{border:2px solid transparent;border-radius:18px;padding:12px;text-align:right;background:color-mix(in srgb,var(--qc) 13%,var(--surface));display:flex;flex-direction:column;gap:2px;position:relative;min-height:82px}
.mbox b{color:color-mix(in srgb,var(--qc) 85%,#000);font-size:.92rem}.mbox span{font-size:.76rem;color:var(--muted)}
.mbox em{position:absolute;left:10px;top:10px;font-style:normal;min-width:26px;height:26px;border-radius:50%;background:var(--qc);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:600}
.mbox.on{border-color:var(--qc)}
.small-m .mbox{min-height:0;padding:10px}
.sugg{margin-top:10px;background:var(--bg);border-radius:18px;padding:12px}
.sugg .chips{margin-top:6px}.sugg .chip-b{background:var(--surface)}
.sg-toggle{margin-inline-start:auto}
.sg-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.sg-h b{font-family:var(--f-display);color:var(--deep)}.sg-h .link{margin-inline-start:auto}
.scats{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.scat{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sc-h{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;padding:10px 14px;border:0;background:none;font:inherit;font-weight:600;color:var(--deep);text-align:start;cursor:pointer}
.sc-h span:first-child{flex:1}.sc-n{min-width:26px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);font-size:.8rem;text-align:center}
.sc-ar{transition:transform .2s;font-size:1.2rem;color:var(--muted)}.scat.open .sc-ar{transform:rotate(-90deg)}
.scat .sgrid{padding:0 12px 12px}.scat.fav .sc-h{color:#9A6A0C}.scat.fav{border-color:#E3C277}
.scat .scard-b{background:var(--bg)}
.sgrid{display:flex;flex-wrap:wrap;gap:8px}
.scard{position:relative;display:flex}
.scard-b{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;text-align:start;cursor:pointer;transition:transform .12s,background .2s}
.scard-b:active{transform:scale(.96)}
.scard-b .plus{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--q-plan);color:#fff;font-weight:700;flex:none;font-size:.9rem}
.scard-b .st{display:flex;flex-direction:column;line-height:1.3}.scard-b small{font-size:.72rem;color:var(--muted)}
.scard .sfav{color:#C99418;font-size:.85rem}
.scard.just .scard-b{background:color-mix(in srgb,var(--q-plan) 14%,var(--surface));border-color:var(--q-plan)}
.scat.fav .scard-b{border-color:#E3C277}
.sx{position:absolute;top:-7px;inset-inline-end:-7px;width:24px;height:24px;border-radius:50%;border:0;background:var(--q-do);color:#fff;font-size:.95rem;line-height:1;cursor:pointer}
.spanel{margin-top:10px;padding:12px;border-radius:16px;background:var(--surface);border:2px solid var(--q-plan);animation:spIn .25s ease}
.spanel .field{width:100%;margin-top:4px}
.sp-ok{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.sp-ok b{color:var(--q-plan)}
.okdot{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--q-plan);color:#fff;font-weight:700}
.sg-add{margin-top:12px}.sg-add input{flex:1 1 140px;min-width:0}.sg-add select{flex:1 1 120px}
@keyframes spIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.spanel{animation:none}.scard-b{transition:none}}
.ctitle{font-family:var(--f-display);font-size:1.15rem;font-weight:600;margin-bottom:6px}
.clblock{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.q2{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:16px;padding:10px 12px}
.yn{display:flex;gap:6px}
.ynb{min-width:64px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.ynb.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.clres{border-radius:16px;padding:12px 14px;background:color-mix(in srgb,var(--qc) 16%,var(--surface));border-inline-start:6px solid var(--qc);display:flex;flex-direction:column}
.clres b{font-family:var(--f-display);color:color-mix(in srgb,var(--qc) 85%,#000)}.clres span{font-size:.88rem}

.tdel{width:28px;height:34px;font-size:1.35rem;color:var(--muted);border-radius:50%}
.tdel:active{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.toast{display:flex;align-items:center;gap:12px}.toast[hidden]{display:none}
.undo{border:0;background:none;color:#9FE0C2;font-weight:700;padding:4px 2px;font-size:.95rem}
.qg-del{font-size:.8rem;color:var(--bad)}

.subhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:16px 0 8px}
.subhead b{font-family:var(--f-display);font-size:1.05rem;color:var(--deep)}
.inbox-head{margin-top:22px;padding-top:16px;border-top:2px dashed var(--line)}
.one-add .add{flex-wrap:nowrap;align-items:center}.one-add input[name=title]{flex:1 1 auto;min-width:0}.when-row{margin-top:8px;align-items:center}
:root[data-page="masai"] .chip-b.radio:has(input:checked){background:var(--deep);color:#fff}
.today-tg{flex:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.daypill{background:#F6D77A!important;color:#5A3D00!important;border-color:#E2B53E!important;font-weight:700}
.mview{margin-top:10px;align-items:center}.mview .link{margin-inline-start:auto}
.daypill{display:inline-flex;align-items:center;gap:3px}:root[data-page="masai"] .chip-b.to-today{flex:none;white-space:nowrap;padding:7px 12px;background:var(--surface);border:1.5px solid var(--deep);color:var(--deep);font-weight:600}
.task.later{background:color-mix(in srgb,var(--surface) 82%,var(--line))}


*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.3}
h2{font-size:1.12rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* page head */
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.ph h1{font-size:1.9rem;letter-spacing:-.01em}
.ph .eyebrow{font-size:.82rem;color:var(--muted)}
.icon-btn{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.icon-btn svg{width:20px;height:20px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:20px;background:var(--hero-bg);color:var(--hero-ink);padding:18px 18px 16px;isolation:isolate}
.hero::after{content:"";position:absolute;inset:auto -20% -70% -20%;height:120%;background:radial-gradient(closest-side,var(--hero-glow),transparent);z-index:-1}
.hero .lbl{color:var(--hero-muted);font-size:.85rem}
.hero .big{font-family:var(--f-display);font-size:2.3rem;font-weight:700;line-height:1.15}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hero .chip{background:rgba(255,255,255,.12);color:var(--hero-ink);border:0;border-radius:999px;padding:4px 12px;font-size:.82rem}
.hero .bar{background:rgba(255,255,255,.16)}
.hero .bar i{background:var(--hero-ink)}

/* sections */
.sec{margin-top:22px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);min-height:52px}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.empty{padding:18px 14px;color:var(--muted);text-align:center;font-size:.92rem}

.check{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.check[aria-pressed="true"]::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-2px) rotate(-45deg)}
.del{flex:none;width:30px;height:30px;border:0;background:transparent;color:var(--muted);border-radius:8px;font-size:1.25rem;line-height:1;padding:0}
.del:hover{background:var(--sunk)}
.time-tag{flex:none;font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--deep);background:var(--deep-soft);border-radius:8px;padding:2px 8px;min-width:64px;text-align:center}

/* forms */
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.add input,.add select,.field{flex:1 1 120px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;height:46px}
.add input.sm,.add select.sm{flex:0 1 110px}
.add input.xs{flex:0 1 84px}
textarea.field{height:auto;min-height:80px;width:100%;resize:vertical}
.btn{border:0;border-radius:12px;padding:0 16px;height:46px;background:var(--accent);color:var(--on-accent);font-weight:600;flex:none}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink);height:38px;font-weight:500;font-size:.9rem}
.btn.danger{background:var(--bad);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-b{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem}
.chip-b[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:.9rem}

/* prayer strip */
.prayers{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.pr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center}
.pr b{display:block;font-weight:500;font-size:.8rem;color:var(--muted)}
.pr span{font-variant-numeric:tabular-nums;font-size:.92rem;font-weight:600}
.pr.past{opacity:.5}
.pr.next{border-color:var(--accent);background:var(--accent-soft)}
.pr.next b{color:var(--accent)}
@media (max-width:420px){.prayers{grid-template-columns:repeat(3,1fr)}}

/* timer */
.timer{text-align:center}
.timer .disp{font-family:var(--f-display);font-size:3.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:.02em}
.timer .mode{font-size:.88rem;color:var(--muted)}
.timer.run .disp{color:var(--accent)}
.timer .ctrl{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}

/* rating */
.rate-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px}
.dots{display:flex;gap:6px}
.dot-b{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.dot-b.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:96px;margin-top:12px}
.week .col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week .b{width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--deep);min-height:3px}
.week .b.none{background:var(--sunk)}
.week .b.today{background:var(--accent)}
.week small{font-size:.7rem;color:var(--muted)}

.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)} .bar.deep i{background:var(--deep)} .bar.acc i{background:var(--accent)}

/* habits */
.hab-days{display:flex;gap:4px;margin-top:6px}
.hd{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:transparent;font-size:.62rem;color:var(--muted);padding:0}
.hd.on{background:var(--deep);border-color:var(--deep);color:var(--bg)}
.cups{display:flex;gap:6px;flex-wrap:wrap}
.cup{width:32px;height:40px;border-radius:4px 4px 10px 10px;border:2px solid var(--deep);background:transparent;padding:0;position:relative;overflow:hidden}
.cup.on{background:var(--deep)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
.stat input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;font-family:var(--f-display);font-size:1.5rem;font-weight:700;padding:0 0 2px;font-variant-numeric:tabular-nums}
.stat input:focus{outline:none;border-bottom-color:var(--accent)}
.spark{width:100%;height:70px;display:block}

/* tabs inside a page */

/* tree that grows with the focus session; seed keeps each tree's shape stable */
function rng(seed){let s=(seed%2147483647)||7;if(s<0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
function treeSVG(p,seed,dead,cls=''){
  p=Math.max(0,Math.min(1,p));const r=rng(seed);const th=10+50*Math.min(1,p/.55),top=112-th;
  const wood=dead?'var(--dead)':'var(--trunk)',lf=[dead?'var(--dead)':'var(--leaf)',dead?'var(--dead)':'var(--leaf2)'];
  let g=`<ellipse cx="60" cy="113" rx="36" ry="5.5" fill="var(--soil)"/><rect x="57.4" y="${top.toFixed(1)}" width="5.2" height="${(th+1).toFixed(1)}" rx="2.4" fill="${wood}"/>`;
  if(p>=.3){const o=Math.min(1,(p-.3)/.15),by=top+th*.42;g+=`<path d="M60 ${by.toFixed(1)} L${(60-15*o).toFixed(1)} ${(by-13*o).toFixed(1)} M60 ${(by+6).toFixed(1)} L${(60+14*o).toFixed(1)} ${(by-6*o).toFixed(1)}" stroke="${wood}" stroke-width="3" stroke-linecap="round" fill="none"/>`}
  if(p<.22){g+=`<ellipse cx="54.5" cy="${(top+1).toFixed(1)}" rx="5.5" ry="3" fill="${lf[0]}" transform="rotate(-25 54.5 ${(top+1).toFixed(1)})"/><ellipse cx="65.5" cy="${(top+1).toFixed(1)}" rx="5.5" ry="3" fill="${lf[1]}" transform="rotate(25 65.5 ${(top+1).toFixed(1)})"/>`}
  const N=24;for(let i=0;i<N;i++){const a=r()*Math.PI*2,d=Math.sqrt(r())*25,rad=6.5+r()*6,cx=60+Math.cos(a)*d*1.15,cy=top+4+Math.sin(a)*d*.8,app=.2+i/N*.78;
    if(p>=app){const s=Math.min(1,.45+(p-app)/.1);g+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(rad*s).toFixed(1)}" fill="${lf[i%2]}" opacity="${dead?.7:.95}"/>`}}
  return `<svg class="tree ${cls}" viewBox="0 0 120 120" aria-hidden="true">${g}</svg>`;
}

function focusSection(fl){const f=S.focus,trees=S.garden.length,task=f.taskId&&S.tasks.find(t=>t.id===f.taskId);

  let body='';
  if(f.mode==='focus'){const p=(Date.now()-f.start)/(f.dur*6e4);
    body=`<div class="focus-live"><div id="f-tree">${treeSVG(p,f.seed)}</div><div class="disp num" id="f-time">${mmss(f.end-Date.now())}</div>
      <p class="sub">${task?`تركّز على: <b>${esc(task.title)}</b>`:'جلسة تركيز'}</p><p class="cheer">ابقَ في التطبيق عشان تكبر شجرتك</p>
      <button class="btn ghost" data-act="focus-quit">إنهاء الجلسة</button></div>`}
  else if(f.mode==='broken'){body=`<div class="focus-live">${treeSVG(f.p||.1,f.seed,true)}<p class="msg">انقطعت جلسة التركيز، حاول مرة أخرى</p>
      <div class="add" style="justify-content:center"><button class="btn" data-act="focus-again">حاول مرة أخرى</button><button class="btn ghost" data-act="focus-idle">لاحقاً</button></div></div>`}
  else if(f.mode==='ask'){body=`<div class="focus-live">${treeSVG(1,f.seed)}<p class="msg">أحسنت! انضافت شجرة لحديقتك</p>
      ${task?`<p class="sub">هل أنجزت المهمة «${esc(task.title)}»؟</p>`:''}
      <div class="add" style="justify-content:center">${task&&task.status!=='done'?'<button class="btn" data-act="focus-done">نعم، أنجزتها</button>':''}<button class="btn ghost" data-act="focus-again">جلسة تركيز أخرى</button><button class="btn ghost" data-act="break-start">استراحة ${S.settings.breakMin} دقائق</button></div></div>`}
  else if(f.mode==='break'){body=`<div class="focus-live"><div class="disp num" id="f-time" style="color:var(--deep)">${mmss(f.end-Date.now())}</div><p class="sub">استراحة: قم، اشرب ماء، وحرّك جسمك</p>
      <button class="btn ghost" data-act="focus-idle">أنهِ الاستراحة</button></div>`}
  else{const custom=![15,25,45].includes(S.settings.focusMin);
    body=`<div class="focus-idle">${treeSVG(0,7)}
      <div class="chips" style="justify-content:center">${[15,25,45].map(n=>`<button class="chip-b big-chip" aria-pressed="${S.settings.focusMin===n}" data-act="f-preset" data-n="${n}">${n} دقيقة</button>`).join('')}<button class="chip-b big-chip" aria-pressed="${custom}" data-act="f-custom">${custom?`${S.settings.focusMin} دقيقة`:'مخصص'}</button></div>
      <form class="add" data-form="f-custom" id="f-custom" hidden style="justify-content:center"><input class="xs" name="min" inputmode="numeric" placeholder="دقائق" required><button class="btn line" style="height:46px">اعتمد</button></form>
      <button class="btn big" data-act="focus-start" style="margin-top:12px">ابدأ التركيز</button>
      <p class="sub" style="text-align:center;margin-top:6px">${S.settings.focusMin} دقيقة تركيز ثم ${S.settings.breakMin} دقائق راحة</p></div>`}
  const garden=S.garden.slice(-24).reverse();
  return `<div class="sec-h"><h2>مؤقت التركيز</h2></div><div class="card">${body}${stats}</div>

/* focus session lifecycle */
let wake=null;
async function holdWake(on){try{if(on&&navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request('screen')}else if(!on&&wake){await wake.release();wake=null}}catch(e){wake=null}}
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}}
function startFocus(taskId){unlockAudio();const dur=S.settings.focusMin;
  S.focus={mode:'focus',taskId:taskId||null,dur,start:Date.now(),end:Date.now()+dur*6e4,seed:Math.floor(Math.random()*1e9)+1};
  const t=taskId&&S.tasks.find(x=>x.id===taskId);if(t&&t.status==='todo')t.status='doing';
  holdWake(true);closeSheet();showTab('focus')}
function focusFinished(){const f=S.focus,t=f.taskId&&S.tasks.find(x=>x.id===f.taskId),k=todayK();
  const fl=S.focusLog[k]||{min:0,count:0};fl.min+=f.dur;fl.count++;S.focusLog[k]=fl;
  S.garden.push({id:uid(),date:k,min:f.dur,task:t?t.title:'',seed:f.seed});
  S.focus={...f,mode:'ask'};holdWake(false);notify('خلصت جلسة التركيز، وكبرت شجرتك');commit()}
function interruptFocus(){const f=S.focus;if(f.mode!=='focus')return;S.focus={...f,mode:'broken',p:Math.min(1,(Date.now()-f.start)/(f.dur*6e4))};holdWake(false);save()}
function notify(msg){toast(msg,6000);beep();try{if(!framed&&'Notification' in window&&Notification.permission==='granted')new Notification('توازن',{body:msg})}catch(e){}}

/* sections switch like tabs so the bar works even where the page itself can't scroll (inside the app's viewer) */
function showTab(t){S.ui.mtab=t;commit();const n=$('.qnav');try{if(n&&n.getBoundingClientRect().top<0)n.scrollIntoView({block:'start'})}catch(e){}}
/* week plan: 7 days from the chosen start, plus anything planned further ahead */
function weekSection(h){const off=S.ui.wk||0,start=addDays(new Date(),off*7),k0=todayK(),days=[...Array(7)].map((_,i)=>addDays(start,i));
  const lastK=dkey(days[6]),total=days.reduce((n,d)=>n+tasksOn(dkey(d)).length,0);
  const later=S.tasks.filter(t=>t.plan&&t.plan>dkey(addDays(new Date(),6))&&!(off&&t.plan<=lastK)).sort((a,b)=>(a.plan+(a.time||'')).localeCompare(b.plan+(b.time||'')));
  const row=t=>`<div class="wrow ${t.status==='done'?'done':''}">${t.kind==='event'?'<span class="evdot" aria-hidden="true"></span>':chk(t.status==='done','t-done',t.id,t.title)}<button class="task-t t" data-act="t-edit" data-id="${t.id}">${esc(t.title)}</button>${t.time?`<span class="pill num">${clockStr(t.time)}</span>`:''}${t.kind==='event'?'<span class="pill ev">حدث</span>':''}<button class="del tdel" data-act="t-x" data-id="${t.id}" aria-label="احذف ${esc(t.title)}">×</button></div>`;
  return `<section class="sec" id="m-week" ${h}>
    <div class="sec-h"><h2>خطة الأسبوع</h2><span class="sub num">${total} بنود</span></div>
    <div class="wnav"><button class="icon-btn" data-act="wk" data-n="-1" aria-label="الأسبوع السابق" ${off<=0?'disabled':''}>›</button><b>${off===0?'الأيام السبعة القادمة':fmtDay(days[0])+' – '+fmtDay(days[6])}</b><button class="icon-btn" data-act="wk" data-n="1" aria-label="الأسبوع التالي">‹</button></div>
    <div class="wdays">${days.map(d=>{const k=dkey(d),ts=tasksOn(k);return `<div class="wday ${k===k0?'today':''}">

  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="منحنى الوزن"><polygon points="${P},${H} ${line} ${W-P},${H}" fill="var(--deep-soft)"/><polyline points="${line}" fill="none" stroke="var(--deep)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--accent)"/></svg>

/* multi-word keywords listed as phrases so they beat their single words */
const RPHRASES={sauce:['دبس الرمان','دبس رمان'],spice:['ثوم بودره','فلفل اسود'],sweet:['كريم كرمل','دريم ويب','بكنج بودر'],bake:['بف باستري'],personal:['مزيل عرق','غسول الوجه','فرشاه اسنان','معجون اسنان','سائل استحمام'],clean:['ادوات تنظيف','سائل غسيل','اكياس زباله','ورق قصدير'],dairy:['جبن مثلثات','جبن موزاريلا'],drink:['عصير برتقال']};
const rnorm=t=>String(t).replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^؀-ۿa-zA-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
const RKW=RCATS.flatMap(([id,, ,w])=>[...w.split(' ').filter(Boolean),...(RPHRASES[id]||[])].map(k=>[rnorm(k),id]));
const RICON={oil:'🫒',grain:'🌾',dairy:'🧀',meat:'🍗',veg:'🥕',sauce:'🥫',bake:'🥐',sweet:'🍰',drink:'🧃',spice:'🧂',personal:'🧴',clean:'🧽',other:'📦',g_food:'🛒',g_care:'🧼',g_other:'📦'};
const rcatOf=id=>RCATS.find(c=>c[0]===id)||RCATS[RCATS.length-1];
function rClassify(text){const n=' '+rnorm(text);if(/(^| )(ال|و)?تونه/.test(n.trim()))return 'meat';const learned=(S.rLearn||{})[n.trim()];if(learned&&RCATS.some(c=>c[0]===learned))return learned;
  let best=null;for(const[k,id]of RKW){if((n.includes(' '+k)||n.includes(' ال'+k)||n.includes(' و'+k))&&(!best||k.length>best[0].length))best=[k,id]}return best?best[1]:'other'}
const RUNITS='كيلو|كيلوات|كجم|كغ|كج|غرام|جرام|جم|لتر|لترات|علبه|علبة|علب|حبه|حبة|حبات|كرتون|كراتين|طبق|اطباق|باكت|باكيت|كيس|اكياس|ربطه|ربطة|قنينه|قنينة|درزن|شده';
function rParse(line){let t=line.replace(/^[\s\-–•*·▪️🔺️•\d]+[.)\-]\s*/,'').replace(/^[\s\-–•*·]+/,'').trim();let qty='';
  const toAr=x=>x.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  let m=t.match(new RegExp(`^([\\d٠-٩.,/½]+\\s*(?:${RUNITS})?)\\s+(.+)$`));if(m){qty=toAr(m[1]).trim();t=m[2]}
  else{m=t.match(new RegExp(`^(.+?)\\s*[:×x\\-]?\\s*([\\d٠-٩.,/½]+\\s*(?:${RUNITS})?|(?:${RUNITS})\\s*[\\d٠-٩]*)$`));if(m&&m[1].trim()){t=m[1];qty=toAr(m[2]).trim()}}
  return {text:t.replace(/[:\-–]+$/,'').trim(),qty}}
function rSplit(raw){return raw.split(/\n|،|,|؛|;|\s+[+\-–\/]\s+/).map(x=>x.trim()).filter(x=>x&&x.replace(/[\s\-–•*·🔺️]/g,''))}
function rAdd(raw){const added=[];rSplit(raw).forEach(line=>{const{text,qty}=rParse(line);if(!text)return;const same=S.groceries.find(g=>!g.done&&rnorm(g.text)===rnorm(text));if(same){if(qty)same.qty=qty;rAdd.dup=(rAdd.dup||0)+1;return}const cat=rClassify(text);S.groceries.push({id:uid(),text,qty,done:false,cat});added.push(cat)});return added}
function rashanView(){const items=S.groceries.map(g=>{if(!g.cat||(g.cat!=='meat'&&rClassify(g.text)==='meat'&&/تون/.test(g.text)))g.cat=rClassify(g.text);return g});const left=items.filter(g=>!g.done).length;
  const groups=RGROUPS.map(([gid,gname])=>{const cats=RCATS.filter(c=>c[1]===gid).map(c=>[c,items.filter(g=>g.cat===c[0]).sort((a,b)=>a.done-b.done)]).filter(([,l])=>l.length);if(!cats.length)return '';

  return `<div class="rashan"><div class="r-head"><div><p class="r-eye">بيتي</p><h2>راشن البيت</h2><p class="r-sub num">${left?`${left} غرض باقي`:items.length?'اشتريت كل شي':'القائمة فاضية'}</p></div><span class="r-dia" aria-hidden="true"></span></div>
    ${left?'<button class="btn r-img" data-act="g-img">تحميل القائمة كصورة PNG</button>':''}
    <form class="r-paste" data-form="grocery-bulk"><label for="r-in">الصق قائمتك أو اكتب غرض</label><textarea id="r-in" name="raw" rows="3" placeholder="مثال:&#10;2 حليب&#10;جبن مثلثات، طماط، كلينكس&#10;صدور دجاج 1 كيلو" required></textarea>
      <button class="btn r-btn">رتّبها وأضف</button></form>
    <div class="r-tools">${left?'<button class="link" data-act="g-copy">انسخ القائمة مرتبة</button>':''}${items.some(g=>g.done)?'<button class="link" data-act="g-clear">امسح المشترى</button>':''}</div>
    ${groups||'<div class="empty">اكتب أو الصق أغراضك فوق، وبتترتب تلقائياً حسب الأقسام.</div>'}
    ${items.length?'<p class="sub r-hint">غرض في القسم الغلط؟ اضغط اسمه وانقله، وبيتذكره المرة الجاية.</p>':''}</div>`}

/* files leave the page through the viewer's downloads capability inside claude.ai, a plain link offline */
let dlCap;try{window.claude&&window.claude.use&&window.claude.use('downloads').then(d=>{dlCap=d}).catch(()=>{})}catch(e){}
async function saveFile(filename,blob){
  if(dlCap){try{await dlCap.save({filename,data:blob});return 'saved'}catch(e){if(e&&e.code==='declined')return 'declined';if(e&&e.code==='rate_limited'){toast('فيه طلب حفظ مفتوح، جرّب بعد شوي');return 'busy'}}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return 'saved'}catch(e){return 'failed'}}

/* راشن البيت as a menu-style picture: pink page, purple diamonds and bands, orange accents, two columns */
async function rashanImage(){
  const open=S.groceries.filter(g=>!g.done).map(g=>(g.cat||(g.cat=rClassify(g.text)),g));
  try{await document.fonts.ready}catch(e){}
  const W=1080,PAD=70,GAP=40,COL=(W-PAD*2-GAP)/2,C={bg:'#F5E8ED',pur:'#6B4F78',or:'#F19A3E',ink:'#3A2A4A',soft:'#E6CFE0',mut:'#8A7396'};
  const F=(w,px,fam)=>`${w} ${px}px ${fam==='h'?'"Baloo Bhaijaan 2","Readex Pro"':'"Readex Pro","IBM Plex Sans Arabic"'},Tahoma,sans-serif`;
  const cv=document.createElement('canvas'),ctx=cv.getContext('2d');
  const wrap=(text,font,max)=>{ctx.font=font;const words=String(text).split(' ');const lines=[];let cur='';words.forEach(w=>{const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>max&&cur){lines.push(cur);cur=w}else cur=t});if(cur)lines.push(cur);return lines};
  /* lay out: per group a full-width band, then its categories flowed into the shorter column */
  const IT=F(500,30),QT=F(700,24),CT=F(700,34,'h');
  const blocks=[];RGROUPS.forEach(([gid,gn])=>{const cats=RCATS.filter(c=>c[1]===gid).map(c=>[c,open.filter(g=>g.cat===c[0])]).filter(([,l])=>l.length);if(!cats.length)return;
    blocks.push({band:gn,gid,n:cats.reduce((a,[,l])=>a+l.length,0)});
    cats.forEach(([c,l])=>{const rows=l.map(g=>{const qw=g.qty?(ctx.font=QT,ctx.measureText(g.qty).width+34):0;return{lines:wrap(g.text,IT,COL-60-qw),qty:g.qty}});
      blocks.push({cat:c[2],id:c[0],rows,h:96+rows.reduce((a,r)=>a+r.lines.length*40+16,0)+10})})});
  const measure=()=>{let y=330;let cols=[0,0];const out=[];blocks.forEach(b=>{if(b.band){y=Math.max(y+cols[0],y+cols[1]);cols=[0,0];out.push({...b,y});y+=110;return}
    const ci=cols[0]<=cols[1]?0:1;out.push({...b,y:y+cols[ci],ci});cols[ci]+=b.h+GAP*.6});return{out,end:Math.max(y+cols[0],y+cols[1])}};
  const L=measure(),H=Math.max(1350,L.end+190);
  const dpr=2;cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);ctx.direction='rtl';
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  /* confetti dashes like the menu */
  const rnd=rng(H+open.length*7);for(let i=0;i<Math.round(H/14);i++){ctx.save();ctx.translate(rnd()*W,rnd()*H);ctx.rotate(rnd()*Math.PI);ctx.fillStyle=rnd()<.7?'rgba(107,79,120,.35)':'rgba(241,154,62,.6)';ctx.fillRect(-7,-1.5,14,3);ctx.restore()}
  const dia=(x,y,s,col)=>{ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillStyle=col;ctx.fillRect(-s/2,-s/2,s,s);ctx.restore()};
  dia(60,40,300,C.pur);dia(250,10,110,C.or);dia(W-20,H-10,260,C.pur);dia(40,H+40,240,C.or);
  /* title */
  ctx.textAlign='right';ctx.fillStyle=C.pur;ctx.font=F(800,96,'h');ctx.fillText('راشن البيت',W-PAD,175);
  ctx.font=F(500,30);ctx.fillStyle=C.mut;ctx.fillText(`${fmtDateLong(new Date())} · ${open.length} ${open.length>2&&open.length<11?'أغراض':'غرض'}`,W-PAD,232);
  ctx.fillStyle=C.or;ctx.fillRect(W-PAD-150,256,150,8);
  L.out.forEach(b=>{
    if(b.band){const y=b.y,x0=PAD,x1=W-PAD;ctx.fillStyle=C.pur;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x0+30,y);ctx.lineTo(x0,y+36);ctx.lineTo(x0+30,y+72);ctx.lineTo(x1,y+72);ctx.closePath();ctx.fill();
      ctx.font='34px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.textAlign='right';ctx.fillText(RICON['g_'+b.gid]||'',x1-22,y+49);ctx.fillStyle='#fff';ctx.font=F(700,36,'h');ctx.fillText(b.band,x1-72,y+49);
      ctx.fillStyle=C.or;const nx=x0+70;ctx.fillRect(nx-34,y+14,68,44);ctx.fillStyle='#3A2A00';ctx.font=F(800,28);ctx.textAlign='center';ctx.fillText(String(b.n),nx,y+46);return}
    const xr=b.ci===0?W-PAD:W-PAD-COL-GAP,xl=xr-COL;let y=b.y;
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(xl,y,COL,b.h,22);else ctx.rect(xl,y,COL,b.h);ctx.fill();
    ctx.font='34px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.textAlign='right';ctx.fillText(RICON[b.id]||'',xr-18,y+56);ctx.fillStyle=C.pur;let cs=34;ctx.font=F(700,cs,'h');while(cs>22&&ctx.measureText(b.cat).width>COL-92){cs-=2;ctx.font=F(700,cs,'h')}ctx.textAlign='right';ctx.fillText(b.cat,xr-64,y+54);y+=112;
    b.rows.forEach((r,i)=>{if(i){ctx.strokeStyle=C.soft;ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(xr-24,y-14);ctx.lineTo(xl+24,y-14);ctx.stroke();ctx.setLineDash([])}
      ctx.strokeStyle=C.pur;ctx.lineWidth=2.5;ctx.strokeRect(xr-50,y-22,24,24);ctx.lineWidth=1;
      ctx.fillStyle=C.ink;ctx.font=IT;ctx.textAlign='right';r.lines.forEach((ln,j)=>ctx.fillText(ln,xr-64,y+j*40));
      if(r.qty){ctx.font=QT;const w=ctx.measureText(r.qty).width+24;ctx.fillStyle=C.soft;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(xl+20,y-28,w,38,19);else ctx.rect(xl+20,y-28,w,38);ctx.fill();ctx.fillStyle=C.pur;ctx.textAlign='center';ctx.fillText(r.qty,xl+20+w/2,y)}
      y+=r.lines.length*40+16})});
  ctx.textAlign='center';ctx.fillStyle=C.mut;ctx.font=F(500,24);ctx.fillText('بيتي · توازن',W/2,H-50);
  return await new Promise(r=>cv.toBlob(r,'image/png'))}

  'fund-amt':(v,f)=>{const n=f.dataset.n,a=num(v.amount),m=wMonth;if(!(a>=0)){toast('اكتب المبلغ رقماً');return false}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(fn){if(el.tagName==='BUTTON'&&el.closest('form')&&el.type!=='submit')e.preventDefault();fn(el.dataset,el,e)}});
let refocus=null;
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fn=F[f.dataset.form];if(!fn)return;const v=Object.fromEntries(new FormData(f));if(fn(v,f,e.submitter)===false)return;refocus=f.dataset.form;commit()});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.health){const k=dkey(),h=S.health[k]=S.health[k]||{},n=num(t.value);if(t.value.trim()===''){delete h[t.dataset.health]}else if(n>=0){h[t.dataset.health]=n}commit();return}
  if(t.dataset.set){const s=S.settings,key=t.dataset.set;
    if(key==='city'){s.city=t.value;const c=CITIES[t.value];if(c[1]!=null){s.lat=c[1];s.lng=c[2]}$('#s-custom').hidden=t.value!=='custom'}
    else if(['lat','lng','budget','waterGoal','breakMin'].includes(key)){const n=num(t.value);if(isFinite(n)){s[key]=key==='waterGoal'?Math.max(1,Math.min(20,Math.round(n))):n}}
    else s[key]=t.value;
    save();render();toast('حُفظ')}
});

/* ---------- routing & tick ---------- */
const PAGES={masai:pMasai,waha:pWaha,beiti:pBeiti,mahfazti:pMahfazti};
let page=(location.hash||'').slice(1);if(!PAGES[page])page=(()=>{try{return localStorage.getItem(KEY+'.page')}catch(e){return null}})()||'masai';if(!PAGES[page])page='masai';
function go(p){if(!PAGES[p]||p===page)return;page=p;try{localStorage.setItem(KEY+'.page',p)}catch(e){}if(p==='mahfazti')wMonth=ckey();render();window.scrollTo(0,0)}
document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go(a.dataset.page);try{history.replaceState(null,'','#'+a.dataset.page)}catch(x){}}));
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
/* dates: a tidy chip (اليوم / السبت 24 أكتوبر) over the native date picker */
const fmtShort=d=>new Intl.DateTimeFormat(LOC,{weekday:'short',day:'numeric',month:'long'}).format(d);
function dpLabel(v){if(!v)return 'اختر التاريخ';const diff=Math.round((parseD(v)-parseD(dkey()))/864e5);
  return diff===0?'اليوم':diff===-1?'أمس':diff===1?'بكرة':fmtShort(parseD(v))+(parseD(v).getFullYear()!==new Date().getFullYear()?' '+parseD(v).getFullYear():'')}
const DP_IC='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
function enhanceDates(root){(root||document).querySelectorAll('input[type=date]').forEach(i=>{
  let w=i.parentElement;if(!w.classList.contains('dp')){w=document.createElement('span');w.className='dp '+i.className;i.before(w);w.innerHTML=DP_IC+'<span class="dp-t"></span>';w.appendChild(i);
    i.addEventListener('click',()=>{try{i.showPicker()}catch(e){}});['input','change'].forEach(ev=>i.addEventListener(ev,()=>{w.querySelector('.dp-t').textContent=dpLabel(i.value)}))}
  w.querySelector('.dp-t').textContent=dpLabel(i.value)})}
function render(){
  document.documentElement.dataset.page=page;
  const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=getComputedStyle(document.documentElement).getPropertyValue('--hero-bg').trim();
  $('#view').innerHTML=banner()+PAGES[page]();
  document.querySelectorAll('.nav a').forEach(a=>a.dataset.page===page?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  if(page==='masai')applyHeroMode();
  enhanceDates($('#view'));
  if(refocus){const i=document.querySelector(`form[data-form="${refocus}"] input:not([type=hidden]):not([type=time]):not([type=date])`);refocus=null;if(i)try{i.focus({preventScroll:true})}catch(e){}}
}
let lastDay=dkey();
function tick(){
  if(dkey()!==lastDay){lastDay=dkey();render();return}
  masarTick();
  if(page!=='masai')return;
  const mc=$('#m-clock');if(mc){const ct=clockHTML(new Date());if(mc.innerHTML!==ct)mc.innerHTML=ct}
  const np=nextPrayer(),c=$('#np-count');if(c){if($('#np-name').textContent!==np.name){render();return}c.textContent=countdown(np.at-Date.now());const rg=$('#np-ring');if(rg)rg.setAttribute('stroke-dashoffset',(326.7*(1-prayerProgress(np,new Date()))).toFixed(1))}
}
render();setInterval(tick,1000);
/* leaving the app mid-session stops the tree */
document.addEventListener('visibilitychange',()=>{if(document.hidden){interruptFocus()}else{if(S.focus.mode==='broken'){render();toast('انقطعت جلسة التركيز، حاول مرة أخرى',4000)}tick()}});
window.addEventListener('pagehide',interruptFocus);
})();
</script>
